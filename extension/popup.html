<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>Attendance</h1>
    <label class="min">Min
      <input id="min" type="number" min="1" max="99" value="75">%
    </label>
  </header>

  <button id="scan" class="primary">Scan this page</button>
  <p id="status" class="status">Open your portal's attendance page, then click Scan.</p>
  <div id="options" class="options" hidden>
    <label title="Lectures whose attendance column shows a dash instead of a ✓">
      <input type="checkbox" id="dashAbsent"> Count “–” lectures as absent
    </label>
    <label><input type="checkbox" id="mergeLabs"> Combine labs with their subject</label>
  </div>
  <p id="check" class="status"></p>

  <section id="overall" class="card overall" hidden></section>
  <ul id="list" class="list"></ul>

  <details class="manual">
    <summary>Add a subject by hand</summary>
    <form id="addForm">
      <input id="mSubject" placeholder="Subject" required>
      <input id="mAttended" type="number" min="0" placeholder="Attended" required>
      <input id="mTotal" type="number" min="1" placeholder="Total" required>
      <button type="submit">Add</button>
    </form>
  </details>

  <footer>
    <button id="clear" class="link">Clear saved data</button>
  </footer>

  <script src="calc.js"></script>
  <script src="popup.js"></script>
</body>
</html>
