<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../extension/popup.css"></head>
<body style="display:flex;gap:20px;width:auto">
<div id="pop" style="width:360px;flex:none"></div>
<iframe id="portal" src="mock-nst.html" style="width:1100px;height:700px;border:1px solid #ccc"></iframe>
<script>
// Minimal chrome.* stub so the real popup.js runs here against the mock portal in the iframe.
const store={};
window.chrome={
  storage:{local:{get:(k,cb)=>cb({...store}),set:(o)=>Object.assign(store,o)}},
  tabs:{query:async()=>[{id:1}]},
  scripting:{executeScript:async({files,func})=>{
    const w=document.getElementById('portal').contentWindow;
    if(files){await new Promise(r=>{const s=w.document.createElement('script');s.src='../extension/scraper.js';s.onload=r;w.document.head.appendChild(s);});return [{}];}
    return [{result:await w.__attScan()}];
  }}
};
(async()=>{
  const html=await fetch('../extension/popup.html').then(r=>r.text());
  const body=html.split('<body>')[1].split('<script')[0];
  document.getElementById('pop').innerHTML=body;
  for(const f of ['../extension/calc.js','../extension/popup.js'])await new Promise(r=>{const s=document.createElement('script');s.src=f;s.onload=r;document.body.appendChild(s);});
})();
</script></body></html>
